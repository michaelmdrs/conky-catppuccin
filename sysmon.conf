-- =============================================================================
-- Conky System Monitor Widget (sysmon) - Catppuccin Mocha
-- =============================================================================

conky.config = {
    -- Atualização e amostragem
    update_interval = 1,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

    -- Configurações de janela
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Renderização e bordas
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    -- Posicionamento e dimensões (Canto superior esquerdo)
    alignment = 'top_left',
    minimum_width = 240,
    maximum_width = 240,
    gap_x = 40,
    gap_y = 40,

    -- Tipografia e localização (Catppuccin Mocha)
    override_utf8_locale = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11',
    default_color = 'CDD6F4',
    uppercase = false,
};

conky.text = [[
${color 89B4FA}󰍛 CPU${alignr}${color}${cpu}%
${color 313244}${cpubar 5,240}${color}
${voffset 10}
${color 94E2D5}󰘚 RAM${alignr}${color}${memperc}%
${color 313244}${membar 5,240}${color}
${voffset 10}
${color A6E3A1}󰋊 SSD${alignr}${color}${fs_used_perc /}%
${color 313244}${fs_bar 5,240 /}${color}
${voffset 10}
${color F9E2AF}󰩟 Temp${alignr}${color}${execi 5 sensors | awk '/Package id 0:/ {print $4}'}
${voffset 10}
${color F38BA8}󰁹 Bateria${alignr}${color}${battery_percent BAT0}%
${color 313244}${battery_bar 5,240 BAT0}${color}
${voffset 10}
${color 89DCEB}󰤨 Wi-Fi${alignr}${color}${wireless_essid wlp0s20f3}
]];
