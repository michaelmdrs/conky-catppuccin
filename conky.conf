conky.config = {

    update_interval = 1,
    total_run_times = 0,

    cpu_avg_samples = 2,
    net_avg_samples = 2,

    override_utf8_locale = true,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11',

    own_window = true,
    own_window_type = 'dock',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    double_buffer = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    minimum_width = 340,
    minimum_height = 300,

    alignment = 'top_left',

    gap_x = 45,
    gap_y = 40,

    default_color = 'CDD6F4',

    default_outline_color = '000000',
    default_shade_color = '000000',

    no_buffers = true,

    uppercase = false,

};

conky.text = [[

${font JetBrainsMono Nerd Font:size=34:bold}${time %H:%M}${font}

${color 89B4FA}${time %A}${color}

${time %d %B %Y}

${voffset 15}

${color 89B4FA}󰍛 CPU${alignr}${color}${cpu}%

${color 313244}${cpubar 4,220}${color}

${voffset 8}

${color 94E2D5}󰘚 RAM${alignr}${color}${memperc}%

${color 313244}${membar 4,220}${color}

${voffset 8}

${color A6E3A1}󰋊 SSD${alignr}${color}${fs_used_perc /}%

${color 313244}${fs_bar 4,220 /}${color}

${voffset 8}

${color F9E2AF}󰩟 CPU Temp${alignr}${color}${execi 5 sensors | awk '/Package id 0:/ {print $4}'}

${voffset 8}

${color F38BA8}󰁹 Battery${alignr}${color}${battery_percent BAT0}%

${color 313244}${battery_bar 4,220 BAT0}${color}

${voffset 8}

${color 89DCEB}󰤨 WiFi

${wireless_essid wlp0s20f3}

]];
