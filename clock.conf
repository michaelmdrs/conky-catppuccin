-- =============================================================================
-- Conky Clock Widget - Catppuccin Mocha
-- =============================================================================

conky.config = {
    -- Atualização e buffer
    update_interval = 1,
    background = true,
    double_buffer = true,

    -- Configurações de janela
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Posicionamento e dimensões (Centralizado no topo)
    alignment = 'top_middle',
    minimum_width = 600,
    maximum_width = 600,
    gap_x = 0,
    gap_y = 120,

    -- Tipografia e cores (Catppuccin Mocha)
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=12',
    default_color = '#CDD6F4',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
};

conky.text = [[
${alignc}${font JetBrainsMono Nerd Font:bold:size=72}${time %H:%M}${font}
${voffset -5}${alignc}${font JetBrainsMono Nerd Font:bold:size=14}${color 89B4FA}${time %A, %d de %B}${color}${font}
]];
