conky.config = {
    lua_load = "~/.config/conky-catppuccin/lua/dashboard.lua",
    update_interval = 1,
    total_run_times = 0,

    background = false,

    cpu_avg_samples = 2,
    net_avg_samples = 2,

    use_xft = true,
    override_utf8_locale = true,

    font = "JetBrainsMono Nerd Font:size=11",

    double_buffer = true,

    own_window = true,
    own_window_type = "desktop",

    own_window_argb_visual = true,
    own_window_argb_value = 0,

    own_window_hints = "undecorated,below,sticky,skip_taskbar,skip_pager",

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    alignment = "top_left",

    minimum_width = 360,
    minimum_height = 600,

    gap_x = 55,
    gap_y = 45,

    default_color = "CDD6F4",

    no_buffers = true,

};

conky.text = [[

${font JetBrainsMono Nerd Font:size=34:bold}${time %H:%M}${font}

${color 89B4FA}${time %A}

${color}${time %d %B %Y}

${voffset 25}

${color A6E3A1}CPU${alignr}${cpu}%

${color 313244}${cpubar 6,280}${color}

${voffset 12}

${color 94E2D5}RAM${alignr}${memperc}%

${color 313244}${membar 6,280}${color}

${voffset 12}

${color F9E2AF}SSD${alignr}${fs_used_perc /}%

${color 313244}${fs_bar 6,280 /}${color}

${voffset 12}

${color F38BA8}Temperatura${alignr}${execi 5 sensors | awk '/Package id 0:/ {print $4}'}

${voffset 12}

${color F5C2E7}Bateria${alignr}${battery_percent BAT0}%

${color 313244}${battery_bar 6,280 BAT0}${color}

${voffset 12}

${color 89DCEB}Wi-Fi

${wireless_essid wlp0s20f3}

]];
